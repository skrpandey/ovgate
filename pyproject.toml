[project]
name = "ovgate"
version = "0.1.0"
description = "Selective-verification gating for open-vocabulary detect-then-verify pipelines"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "scikit-learn>=1.1"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
